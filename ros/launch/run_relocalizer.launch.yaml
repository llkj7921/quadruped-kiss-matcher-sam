launch:
  - arg: {name: map_directory, default: '', description: Complete KISS-SAM map-product directory}
  - arg: {name: config_path, default: $(find-pkg-share kiss_matcher_ros)/config/relocalization_config.yaml}
  - arg: {name: odom_topic, default: '/odometry'}
  - arg: {name: scan_topic, default: '/cloud_registered'}
  - node:
      pkg: kiss_matcher_ros
      exec: kiss_matcher_relocalizer
      name: kiss_matcher_relocalizer
      output: screen
      remap:
        - {from: odom, to: $(var odom_topic)}
        - {from: cloud, to: $(var scan_topic)}
      param:
        - from: $(var config_path)
        - name: map_directory
          value: $(var map_directory)
